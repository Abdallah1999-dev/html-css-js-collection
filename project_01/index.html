<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Document</title>
</head>
<body>
  <div class="card">
    <div class="your-result">
      <p class="label">your result</p>
      <div class="circle">
        <p class="number">76</p>
      </div>
      <p class="result">
        great
      </p>
      <p class="note">
        you scored heigher than 65% of <br>the people who have taken <br> these tests.
      </p>
    </div>
    <div class="summary">
      <p class="label">summary</p>
      <div class="detailed-result">
        <div class="subject">
            <div class="logo-subject">
              <img src="./assets/images/icon-reaction.svg" alt="">
              <p class="subject-name">reaction</p>
          </div>
          <p class="degree"><span>80</span> / 100</p>
        </div> 
        <div class="subject">
          <div class="logo-subject">
            <img src="./assets/images/icon-memory.svg" alt="">
            <p class="subject-name">memory</p>
          </div>
          <p class="degree"><span>92</span> / 100</p>
        </div> 
        <div class="subject">
          <div class="logo-subject">
            <img src="./assets/images/icon-verbal.svg" alt="">
            <p class="subject-name">verbal</p>
          </div>
          <p class="degree"><span>62</span> / 100</p>
        </div> 
        <div class="subject">
          <div class="logo-subject">
            <img src="./assets/images/icon-visual.svg" alt="">
            <p class="subject-name">visual</p>
          </div>
          <p class="degree"><span>73</span> / 100</p>
        </div> 
      </div>
      <a href="#">continue</a>
    </div>
  </div>

</body>
</html>
